name: orbita
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orbita
      POSTGRES_USER: orbita
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-env.sh}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U orbita -d orbita"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: orbita
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run scripts/init-env.sh}
    ports: ["127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"]
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  api:
    build: .
    image: orbita-calendar:local
    environment:
      HTTP_ADDR: :8080
      STORAGE: postgres
      DATABASE_URL: postgres://orbita:${POSTGRES_PASSWORD}@postgres:5432/orbita?sslmode=disable
      RABBITMQ_URL: amqp://orbita:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET:?Run scripts/init-env.sh}
      SESSION_TTL: 1h
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
    ports: ["127.0.0.1:${APP_PORT:-8080}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 4s
      retries: 20
    stop_grace_period: 30s
    restart: unless-stopped
  worker:
    image: orbita-calendar:local
    build: .
    command: [/app/worker, -addr, ":8082", -workers, "4"]
    environment:
      RABBITMQ_URL: amqp://orbita:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    depends_on:
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8082/readyz]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.15.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    depends_on: [api, worker]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/ready]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: orbita
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run scripts/init-env.sh}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  loadgen:
    profiles: [load]
    image: orbita-calendar:local
    build: .
    command: [/app/loadgen, -url, http://api:8080, -users, "20", -rate, "20", -duration, 30s, -serve, -output, /results/load-report.json]
    volumes: [load_results:/results]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8083/healthz]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 20s
volumes:
  postgres_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  load_results:
